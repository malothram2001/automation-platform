[pytest]
addopts = -s -v
asyncio_mode = auto

# Test types (see new_backend/modules/test_management/test_types.py).
# Mark a test with its type and the platform picks it up everywhere:
#   @pytest.mark.smoke            → Smoke Testing
#   @allure.tag("regression")     → Regression Testing
#   @allure.label("testType", "uat")
# Unmarked tests count as Functional Testing (the configured default).
markers =
    functional: Functional Testing - verifies a feature behaves as specified
    smoke: Smoke Testing - shallow checks that the build is worth testing
    sanity: Sanity Testing - narrow checks after a fix or small change
    regression: Regression Testing - confirms existing behaviour still works
    system: System Testing - the complete, integrated system
    e2e: End-to-End (E2E) Testing - a whole user journey
    uat: User Acceptance Testing (UAT) - business sign-off
    integration: Integration Testing - interaction between modules or services
